; ESP_Sentinel — ESP32-C3 telemetry receiver.
; Generic C3 dev board; change `board` for XIAO / Lolin as noted below.

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Native-USB board: route Serial to USB-CDC so UART0's GPIO20/21 are free for
; Serial1 (the master link). Drop these two flags for CH340/CP210x bridge boards.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Common alternative boards:
; board = seeed_xiao_esp32c3
; board = lolin_c3_mini
